
<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Mahasiswa - ACARA 29</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Tambah Data Mahasiswa</h4>
        </div>

        <div class="card-body">
            <div id="notifikasi" aria-live="polite"></div>

            <form id="formTambah" novalidate>
                <div class="mb-3">
                    <label for="nim" class="form-label">NIM</label>
                    <input type="text" id="nim" class="form-control" required>
                    <div class="invalid-feedback">NIM wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label for="nama" class="form-label">Nama Mahasiswa</label>
                    <input type="text" id="nama" class="form-control" required>
                    <div class="invalid-feedback">Nama wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label for="prodi" class="form-label">Program Studi</label>
                    <input type="text" id="prodi" class="form-control" required>
                    <div class="invalid-feedback">Program studi wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label for="foto" class="form-label">Foto Mahasiswa</label>
                    <input
                        type="file"
                        id="foto"
                        class="form-control"
                        accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                    >
                    <small class="text-muted">
                        Format JPG/PNG, maksimal 2 MB.
                    </small>
                </div>

                <button type="submit" class="btn btn-primary" id="btnSimpan">
                    Simpan Data
                </button>

                <a href="dashboard.html" class="btn btn-secondary">
                    Kembali
                </a>
            </form>
        </div>
    </div>
</div>

<script>
const BASE_URL = "https://faulacara28.my.id";

const form = document.getElementById("formTambah");
const notifikasi = document.getElementById("notifikasi");
const btnSimpan = document.getElementById("btnSimpan");

function tampilkanNotifikasi(pesan, jenis) {
    notifikasi.innerHTML = "";

    const alert = document.createElement("div");
    alert.className = `alert alert-${jenis} alert-dismissible fade show`;
    alert.setAttribute("role", "alert");
    alert.appendChild(document.createTextNode(pesan));

    const tombol = document.createElement("button");
    tombol.type = "button";
    tombol.className = "btn-close";
    tombol.setAttribute("data-bs-dismiss", "alert");
    tombol.setAttribute("aria-label", "Tutup");

    alert.appendChild(tombol);
    notifikasi.appendChild(alert);
}

function validasiInput() {
    const nim = document.getElementById("nim");
    const nama = document.getElementById("nama");
    const prodi = document.getElementById("prodi");

    [nim, nama, prodi].forEach(input => {
        input.value = input.value.trim();
        input.setCustomValidity("");
    });

    let valid = true;

    [nim, nama, prodi].forEach(input => {
        if (!input.value) {
            input.setCustomValidity("Kolom ini wajib diisi.");
            valid = false;
        }
    });

    form.classList.add("was-validated");

    return valid && form.checkValidity();
}

async function bacaRespons(response) {
    const teks = await response.text();

    try {
        return teks ? JSON.parse(teks) : {};
    } catch {
        throw new Error("Respons server tidak valid.");
    }
}

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    if (btnSimpan.disabled) {
        return;
    }

    if (!validasiInput()) {
        tampilkanNotifikasi(
            "Validasi gagal! NIM, nama, dan program studi wajib diisi.",
            "warning"
        );
        return;
    }

    const token = localStorage.getItem("token");

    if (!token) {
        tampilkanNotifikasi(
            "Sesi login tidak ditemukan. Silakan login kembali.",
            "danger"
        );

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

        return;
    }

    const fileFoto = document.getElementById("foto").files[0];

    if (fileFoto) {
        const ekstensiValid = ["image/jpeg", "image/png"];

        if (!ekstensiValid.includes(fileFoto.type)) {
            tampilkanNotifikasi(
                "Foto harus berformat JPG atau PNG.",
                "danger"
            );
            return;
        }

        if (fileFoto.size > 2 * 1024 * 1024) {
            tampilkanNotifikasi(
                "Ukuran foto maksimal 2 MB.",
                "danger"
            );
            return;
        }
    }

    const formData = new FormData();

    formData.append("nim", document.getElementById("nim").value);
    formData.append("nama", document.getElementById("nama").value);
    formData.append("prodi", document.getElementById("prodi").value);

    if (fileFoto) {
        formData.append("foto", fileFoto);
    }

    btnSimpan.disabled = true;
    btnSimpan.textContent = "Menyimpan...";

    try {
        const response = await fetch(`${BASE_URL}/mahasiswa`, {
            method: "POST",
            headers: {
                Authorization: `Bearer ${token}`
            },
            body: formData
        });

        const hasil = await bacaRespons(response);

        if (response.status === 401) {
            localStorage.removeItem("token");
            localStorage.removeItem("role");
            localStorage.removeItem("username");

            tampilkanNotifikasi(
                "Sesi login telah berakhir. Silakan login kembali.",
                "warning"
            );

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);

            return;
        }

        if (!response.ok || !hasil.success) {
            throw new Error(
                hasil.message || "Gagal menambahkan data mahasiswa."
            );
        }

        tampilkanNotifikasi(
            "Berhasil! Data mahasiswa telah ditambahkan.",
            "success"
        );

        form.reset();
        form.classList.remove("was-validated");

    } catch (error) {
        console.error("Kesalahan tambah mahasiswa:", error);

        tampilkanNotifikasi(
            error instanceof TypeError
                ? "Koneksi jaringan bermasalah. Data belum dapat dipastikan tersimpan. Periksa dashboard sebelum mencoba lagi."
                : "Gagal menambahkan data: " + error.message,
            "danger"
        );

    } finally {
        btnSimpan.disabled = false;
        btnSimpan.textContent = "Simpan Data";
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
