
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mahasiswa - ACARA 29</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-warning">
            <h4 class="mb-0">Edit Data Mahasiswa</h4>
        </div>

        <div class="card-body">
            <div id="notifikasi" aria-live="polite"></div>

            <div id="loading" class="alert alert-info">
                Memuat data mahasiswa...
            </div>

            <form id="formEdit" novalidate style="display: none;">
                <div class="mb-3">
                    <label for="nim" class="form-label">NIM</label>
                    <input type="text" id="nim" class="form-control" required>
                    <div class="invalid-feedback">NIM wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label for="nama" class="form-label">Nama Mahasiswa</label>
                    <input type="text" id="nama" class="form-control" required>
                    <div class="invalid-feedback">Nama wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label for="prodi" class="form-label">Program Studi</label>
                    <input type="text" id="prodi" class="form-control" required>
                    <div class="invalid-feedback">Program studi wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Foto Saat Ini</label>
                    <div id="fotoLama" class="mb-2"></div>

                    <label for="foto" class="form-label">Ganti Foto (Opsional)</label>
                    <input
                        type="file"
                        id="foto"
                        class="form-control"
                        accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                    >
                    <small class="text-muted">
                        JPG/PNG, maksimal 2 MB. Kosongkan jika tidak ingin mengganti foto.
                    </small>
                </div>

                <button type="submit" class="btn btn-warning" id="btnSimpan">
                    Simpan Perubahan
                </button>

                <a href="dashboard.html" class="btn btn-secondary">Kembali</a>
            </form>
        </div>
    </div>
</div>

<script>
const BASE_URL = "https://faulacara28.my.id";

const form = document.getElementById("formEdit");
const notifikasi = document.getElementById("notifikasi");
const loading = document.getElementById("loading");
const btnSimpan = document.getElementById("btnSimpan");

const parameter = new URLSearchParams(window.location.search);
const id = parameter.get("id");
const token = localStorage.getItem("token");

// Membaca respons API dengan aman
async function bacaRespons(response) {
    const teks = await response.text();

    let hasil;

    try {
        hasil = JSON.parse(teks);
    } catch (error) {
        throw new Error(
            "Server memberikan respons yang tidak valid. Periksa koneksi atau konfigurasi API."
        );
    }

    return hasil;
}

// Retry otomatis satu kali khusus permintaan GET
async function fetchDenganRetry(url, options = {}) {
    let percobaan = 0;
    const maksimalPercobaan = 2;

    while (percobaan < maksimalPercobaan) {
        try {
            return await fetch(url, options);
        } catch (error) {
            percobaan++;

            if (percobaan >= maksimalPercobaan) {
                throw new Error(
                    "Koneksi jaringan gagal setelah dicoba dua kali. Periksa koneksi internet."
                );
            }

            console.warn(
                "Permintaan gagal. Mencoba ulang...",
                error
            );
        }
    }
}

// Menampilkan notifikasi
function tampilkanNotifikasi(pesan, jenis) {
    notifikasi.innerHTML = "";

    const alert = document.createElement("div");
    alert.className = `alert alert-${jenis} alert-dismissible fade show`;
    alert.setAttribute("role", "alert");

    alert.appendChild(document.createTextNode(pesan));

    const tombol = document.createElement("button");
    tombol.type = "button";
    tombol.className = "btn-close";
    tombol.setAttribute("data-bs-dismiss", "alert");
    tombol.setAttribute("aria-label", "Tutup");

    alert.appendChild(tombol);
    notifikasi.appendChild(alert);
}

// Menangani sesi login yang kedaluwarsa
function tanganiSesiBerakhir() {
    localStorage.removeItem("token");
    localStorage.removeItem("role");
    localStorage.removeItem("username");

    tampilkanNotifikasi(
        "Sesi login telah berakhir. Silakan login kembali.",
        "warning"
    );

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1500);
}

// Memuat data mahasiswa untuk diedit
async function muatDataUntukEdit(id) {
    if (!token) {
        loading.className = "alert alert-danger";
        loading.textContent = "Sesi login tidak ditemukan. Silakan login kembali.";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

        return;
    }

    try {
        const res = await fetchDenganRetry(
            `${BASE_URL}/mahasiswa?id=${encodeURIComponent(id)}`,
            {
                method: "GET",
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const hasil = await bacaRespons(res);

        if (res.status === 401) {
            tanganiSesiBerakhir();
            return;
        }

        if (!res.ok || !hasil.success) {
            throw new Error(
                hasil.message || "Gagal mengambil data mahasiswa."
            );
        }

        const data = hasil.data;

        if (!data) {
            throw new Error("Data mahasiswa tidak ditemukan.");
        }

        document.getElementById("nim").value = data.nim || "";
        document.getElementById("nama").value = data.nama || "";
        document.getElementById("prodi").value = data.prodi || "";

        const fotoLama = document.getElementById("fotoLama");
        fotoLama.innerHTML = "";

        if (data.foto) {
            const gambar = document.createElement("img");

            gambar.src = `../uploads/${encodeURIComponent(data.foto)}`;
            gambar.alt = "Foto mahasiswa";
            gambar.style.cssText =
                "width:120px;height:120px;object-fit:cover;border-radius:8px;";

            gambar.onerror = function() {
                fotoLama.textContent = "Foto tidak dapat dimuat.";
            };

            fotoLama.appendChild(gambar);
        } else {
            fotoLama.textContent = "Belum ada foto.";
        }

        loading.style.display = "none";
        form.style.display = "block";

    } catch (error) {
        loading.className = "alert alert-danger";
        loading.textContent = error.message;

        tampilkanNotifikasi(
            "Gagal memuat data mahasiswa: " + error.message,
            "danger"
        );
    }
}

// Validasi input
function validasiInput() {
    const nim = document.getElementById("nim");
    const nama = document.getElementById("nama");
    const prodi = document.getElementById("prodi");

    [nim, nama, prodi].forEach(input => {
        input.value = input.value.trim();
        input.setCustomValidity("");
    });

    let valid = true;

    [nim, nama, prodi].forEach(input => {
        if (!input.value) {
            input.setCustomValidity("Kolom ini wajib diisi.");
            valid = false;
        }
    });

    form.classList.add("was-validated");

    return valid && form.checkValidity();
}

// Menyimpan perubahan mahasiswa
async function simpanPerubahan(id) {
    const formData = new FormData();

    formData.append(
        "nim",
        document.getElementById("nim").value
    );

    formData.append(
        "nama",
        document.getElementById("nama").value
    );

    formData.append(
        "prodi",
        document.getElementById("prodi").value
    );

    const fileFoto = document.getElementById("foto").files[0];

    if (fileFoto) {
        const ekstensiValid = ["image/jpeg", "image/png"];

        if (!ekstensiValid.includes(fileFoto.type)) {
            throw new Error("Foto harus berformat JPG atau PNG.");
        }

        if (fileFoto.size > 2 * 1024 * 1024) {
            throw new Error("Ukuran foto maksimal 2 MB.");
        }

        formData.append("foto", fileFoto);
    }

    // PUT tidak menggunakan retry otomatis
    const res = await fetch(
        `${BASE_URL}/mahasiswa?id=${encodeURIComponent(id)}`,
        {
            method: "PUT",
            headers: {
                Authorization: `Bearer ${token}`
            },
            body: formData
        }
    );

    const hasil = await bacaRespons(res);

    if (res.status === 401) {
        tanganiSesiBerakhir();
        return;
    }

    if (!res.ok || !hasil.success) {
        throw new Error(
            hasil.message || "Gagal memperbarui data mahasiswa."
        );
    }

    tampilkanNotifikasi(
        "Berhasil! Data mahasiswa telah diperbarui.",
        "success"
    );

    setTimeout(() => {
        window.location.href = "dashboard.html";
    }, 1500);
}

// Submit form
form.addEventListener("submit", async function(e) {
    e.preventDefault();

    if (!validasiInput()) {
        tampilkanNotifikasi(
            "Validasi gagal! NIM, nama, dan program studi wajib diisi.",
            "warning"
        );
        return;
    }

    if (!id || !token) {
        tampilkanNotifikasi(
            "ID atau sesi login tidak valid.",
            "danger"
        );
        return;
    }

    const fileFoto = document.getElementById("foto").files[0];

    if (fileFoto) {
        if (!["image/jpeg", "image/png"].includes(fileFoto.type)) {
            tampilkanNotifikasi(
                "Foto harus berformat JPG atau PNG.",
                "danger"
            );
            return;
        }

        if (fileFoto.size > 2 * 1024 * 1024) {
            tampilkanNotifikasi(
                "Ukuran foto maksimal 2 MB.",
                "danger"
            );
            return;
        }
    }

    btnSimpan.disabled = true;
    btnSimpan.textContent = "Menyimpan...";

    try {
        await simpanPerubahan(id);

    } catch (error) {
        tampilkanNotifikasi(
            "Gagal memperbarui data: " + error.message,
            "danger"
        );

    } finally {
        btnSimpan.disabled = false;
        btnSimpan.textContent = "Simpan Perubahan";
    }
});

// Menjalankan halaman edit
if (id) {
    muatDataUntukEdit(id);
} else {
    loading.className = "alert alert-danger";
    loading.textContent = "ID mahasiswa tidak ditemukan.";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
